<!DOCTYPE html>
<html>
<head>
    <title>Pizza Order Form</title>
</head>
<body>

<h1>Pizza Order Form</h1>

<fieldset>

1/2 kg Cakes
<input type="text" id="small">
<br><br>

1 kg Cakes
<input type="text" id="medium">
<br><br>

Tip:

<label>
<input type="radio" value="10" name="tip">
10%
</label>

<label>
<input type="radio" value="15" name="tip" checked>
15%
</label>

<label>
<input type="radio" value="20" name="tip">
20%
</label>

<br><br>

<button onclick="calculateOrder()">Calculate Order</button>

</fieldset>

<p>
Cost of order:
<span id="price"></span>
</p>

<script>

function calculateOrder() {

    var small = parseInt(document.getElementById("small").value) || 0;
    var medium = parseInt(document.getElementById("medium").value) || 0;

    var tip = document.querySelector(
        'input[name="tip"]:checked'
    ).value;

    tip = parseInt(tip);

    var cost = (small * 100) + (medium * 200);

    // Add 9% tax
    var tax = cost * 0.09;

    var total = cost + tax;

    // Add tip
    total = total + (total * tip / 100);

    document.getElementById("price").innerHTML =
        total.toFixed(2);
}

</script>

</body>
</html>
