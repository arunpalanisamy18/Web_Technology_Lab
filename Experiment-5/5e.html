<!DOCTYPE html>
<html>
<head>
    <title>Heads or Tails</title>
</head>
<body>

<h1>Heads or Tails?</h1>

<div>

<img src="both.jpg" id="coin" width="150" height="150">

<br><br>

<button onclick="flipFunction()">Flip</button>

</div>

<p>
Heads Total:
<span id="num_heads">0</span>
</p>

<p>
Tails Total:
<span id="num_tails">0</span>
</p>

<script>

var heads = 0;
var tails = 0;

function flipFunction() {

    var random = Math.floor(Math.random() * 2);

    if (random == 0) {

        document.getElementById("coin").src = "Head.jpg";

        heads++;

        document.getElementById("num_heads").innerHTML = heads;
    }
    else {

        document.getElementById("coin").src = "Tail.jpg";

        tails++;

        document.getElementById("num_tails").innerHTML = tails;
    }
}

</script>

</body>
</html>
