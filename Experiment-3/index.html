<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiment 3 - Responsive Webpage using HTML5 & CSS3</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            background:#eef2f7;
            color:#333;
        }

        .container{
            width:90%;
            max-width:900px;
            margin:40px auto;
        }

        h1{
            color:#0b5dbb;
            font-size:48px;
            margin-bottom:20px;
        }

        p{
            font-size:18px;
            margin-bottom:25px;
        }

        hr{
            margin-bottom:25px;
        }

        .card{
            display:block;
            text-decoration:none;
            background:#fff;
            color:#0b5dbb;
            padding:22px;
            margin:20px 0;
            border-radius:10px;
            box-shadow:0 4px 10px rgba(0,0,0,.12);
            transition:.25s;
            font-size:28px;
            font-weight:bold;
        }

        .card:hover{
            transform:translateY(-3px);
            background:#0b5dbb;
            color:#fff;
        }
    </style>

</head>

<body>

<div class="container">

    <h1>Experiment 3 : Responsive Webpage using HTML5 & CSS3</h1>

    <p>
        Student ID : URK24CS1169
    </p>

    <hr>

    <a class="card" href="3.html">
        Exercise 3 : Responsive Webpage using HTML5 & CSS3
    </a>

</div>

</body>
</html>
